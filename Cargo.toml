[package]
name = "alphasantorini"
version = "0.4.0"
edition = "2021"
description = "In-browser WebAssembly Santorini engine powered by SANTNNUE03 across 44 Pantheon powers"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", default-features = false, features = ["alloc", "derive"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }

[profile.test]
opt-level = 3

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
